services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cparena
      POSTGRES_PASSWORD: cparena
      POSTGRES_DB: cparena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cparena -d cparena"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
